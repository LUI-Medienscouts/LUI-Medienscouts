name: Supabase Keep Alive

on:
  schedule:
    # Um 08:17 Uhr UTC (Vermeidet GitHub Action Stau zur vollen Stunde)
    - cron: '17 8 * * *'
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest

    steps:
      - name: Insert Ping and Cleanup Old Records
        run: |
          # --- KONFIGURATION ---
          # Trage hier den Namen deiner Supabase-Tabelle ein
          TABLE_NAME="memelist"
          # ---------------------

          CURRENT_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          # Berechnet das Datum von vor exakt 30 Tagen im selben ISO-Format
          THIRTY_DAYS_AGO=$(date -d "30 days ago" -u +"%Y-%m-%dT%H:%M:%SZ")
          
          echo "=== SCHRITT 1: Führe normalen INSERT aus ($CURRENT_TIME) ==="
          
          # Wir senden keine "id" mehr mit. Supabase sollte die ID für neue Zeilen automatisch generieren.
          RESPONSE_INSERT=$(curl -s -w "%{http_code}" \
            -X POST \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"last_ping\": \"$CURRENT_TIME\"}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/$TABLE_NAME")
            
          HTTP_STATUS_INSERT=${RESPONSE_INSERT: -3}
          BODY_INSERT=${RESPONSE_INSERT::-3}
          
          echo "HTTP Status (INSERT): $HTTP_STATUS_INSERT"
          
          if [ "$HTTP_STATUS_INSERT" -ge 400 ]; then
            echo "FEHLER: Supabase hat den INSERT abgelehnt! Antwort: $BODY_INSERT"
            exit 1
          fi
          echo "INSERT erfolgreich!"
          
          echo " "
          echo "=== SCHRITT 2: Lösche Einträge älter als 30 Tage ($THIRTY_DAYS_AGO) ==="
          
          # Nutzt den PostgREST Filter "?last_ping=lt.<datum>" (lt = less than)
          RESPONSE_DELETE=$(curl -s -w "%{http_code}" \
            -X DELETE \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/$TABLE_NAME?last_ping=lt.$THIRTY_DAYS_AGO")
            
          HTTP_STATUS_DELETE=${RESPONSE_DELETE: -3}
          BODY_DELETE=${RESPONSE_DELETE::-3}
          
          echo "HTTP Status (DELETE): $HTTP_STATUS_DELETE"
          
          if [ "$HTTP_STATUS_DELETE" -ge 400 ]; then
            echo "FEHLER: Supabase hat das DELETE abgelehnt! Antwort: $BODY_DELETE"
            exit 1
          fi
          echo "Bereinigung erfolgreich!"
    
      - name: Keepalive Workflow
        uses: gautamkrishnar/keepalive-workflow@v2
