name: Supabase Keep Alive

on:
  schedule:
    # 17 statt 0 Minuten: Vermeidet die Server-Überlastung bei GitHub Actions zur vollen Stunde
    - cron: '17 8 * * *'
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest

    steps:
      - name: Generate real Database Activity
        run: |
          echo "Sende Schreibzugriff (UPSERT) an Supabase..."
          
          CURRENT_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          
          # Führt den REST-Aufruf aus und speichert den HTTP-Statuscode direkt am Ende
          # ACHTUNG: Prüfe, ob deine Tabelle wirklich "keep_alive" oder "memelist" heißt!
          RESPONSE=$(curl -s -w "%{http_code}" \
            -X POST \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates" \
            -d "{\"id\": 1, \"last_ping\": \"$CURRENT_TIME\"}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/keep_alive?on_conflict=id")
            
          # Trennt den Body von dem 3-stelligen HTTP-Statuscode
          HTTP_STATUS=${RESPONSE: -3}
          BODY=${RESPONSE::-3}
          
          echo "HTTP Status: $HTTP_STATUS"
          echo "Antwort der Datenbank: $BODY"
          
          # Lässt die GitHub Action "fehlschlagen", wenn Supabase einen Fehler wirft (z.B. 400, 401, 404)
          if [ "$HTTP_STATUS" -ge 400 ]; then
            echo "FEHLER: Supabase hat den Schreibzugriff abgelehnt!"
            exit 1
          fi
          
          echo "Ping erfolgreich in der Datenbank vermerkt!"
