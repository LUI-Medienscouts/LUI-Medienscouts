name: Supabase Keep Alive

on:
  schedule:
    # Führt das Skript jeden Tag um 08:00 Uhr UTC aus
    - cron: '0 8 1 * *'
  # Erlaubt es, das Skript manuell über einen Button zu starten
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest

    steps:
      - name: Generate real Database Activity
        run: |
          echo "Sende Schreibzugriff (UPSERT) an Supabase, um Inaktivität zu verhindern..."
          
          # Erzeuge den aktuellen Zeitstempel (ISO 8601 Format)
          CURRENT_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          
          # Führt einen UPSERT auf der "keep_alive" Tabelle aus.
          # Das garantiert eine echte Datenbank-Schreiboperation, ohne neue Zeilen zu stapeln.
          curl -s -o /dev/null -w "HTTP Status: %{http_code}\n" \
          -X POST \
          -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
          -H "Content-Type: application/json" \
          -H "Prefer: resolution=merge-duplicates" \
          -d "{\"id\": 1, \"last_ping\": \"$CURRENT_TIME\"}" \
          "${{ secrets.SUPABASE_URL }}/rest/v1/memelist"
